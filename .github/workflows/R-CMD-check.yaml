name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      # imurun is pure R (no compiled code), so cross-platform risk is low and a
      # leaner matrix than imuGAP's suffices: Ubuntu across the R-version range
      # (oldrel pins the R >= 4.1 floor; devel catches upcoming changes) plus
      # Windows release, the one OS where pure-R behaviour and install_cli()
      # genuinely differ. macOS is omitted (~= Linux for pure R, and 10x billing
      # minutes on a private repo); CRAN's incoming checks cover more platforms
      # at submission time.
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel'}
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: windows-latest, r: 'release'}

    continue-on-error: ${{ matrix.config.r == 'devel' }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2, any::pkgload
          needs: check

      # man/*.Rd is gitignored and regenerated here (imuGAP installs as an
      # ordinary dependency, binary where available). imurun is pure R, so
      # there is no Stan toolchain or fitted-data generation to run first.
      - name: Generate documentation
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"error"'

  check-result:
    if: always()
    needs: [R-CMD-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks passed
        run: |
          if [ "${{ needs.R-CMD-check.result }}" = "failure" ]; then
            echo "One or more required checks failed"
            exit 1
          fi
